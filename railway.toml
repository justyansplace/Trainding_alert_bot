# Конфигурация Railway.
#
# Регион здесь НЕ задаётся намеренно — он выбирается в интерфейсе при создании
# сервиса, и это самая важная настройка: Binance блокирует американские IP и
# отдаёт HTTP 451. По умолчанию Railway разворачивает в US West, поэтому нужен
# EU West (Amsterdam). Идентификаторы регионов у платформы меняются, и неверное
# значение в конфиге привело бы к молчаливому падению обратно на умолчание.
#
# Том тоже подключается в интерфейсе: Volume -> mount path /app/data.
# Без него SQLite ложится в контейнер и стирается при каждом деплое, унося
# уровни пользователей и историю срабатываний.

[build]
builder = "DOCKERFILE"

[deploy]
# Проверка ходит по HTTP снаружи контейнера: собственный HEALTHCHECK из
# Dockerfile платформа не использует. Эндпоинт отвечает 503, если цикл цены
# перестал делать обороты, — тогда Railway перезапустит сервис.
healthcheckPath = "/health"
healthcheckTimeout = 120

restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10

# Между SIGTERM и SIGKILL. Бот на остановке дожидается отправки сообщений,
# уже поставленных в очередь; двадцати секунд хватает с запасом.
drainingSeconds = 25
